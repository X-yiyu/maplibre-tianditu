<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre-Tianditu 全功能演示</title>
  <script src="./dist/maplibre-tianditu.umd.js"></script>
  <link href="./dist/maplibre-tianditu.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      background: #f5f5f5;
    }

    .sidebar {
      width: 360px;
      min-width: 360px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 4px;
    }

    .section {
      background: #fafafa;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 12px;
    }

    .section h3 {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
      font-family: monospace;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background: #1677ff;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    button:hover {
      background: #4096ff;
    }

    button.danger {
      background: #ff4d4f;
    }

    button.danger:hover {
      background: #ff7875;
    }

    button.success {
      background: #52c41a;
    }

    button.success:hover {
      background: #73d13d;
    }

    button.warning {
      background: #faad14;
    }

    button.warning:hover {
      background: #ffc53d;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .map-wrapper {
      flex: 1;
      position: relative;
    }

    #maplibre-map {
      width: 100%;
      height: 100%;
    }

    .info-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      max-width: 280px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .info-panel pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .coord-display {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <h2>MapLibre-Tianditu 演示</h2>

    <div class="section">
      <h3>1. 天地图 API Key</h3>
      <label>请输入你的天地图密钥 (tiandituKey)</label>
      <input type="text" id="apiKeyInput" placeholder="输入天地图Key后点击初始化" />
      <button onclick="initMap()">初始化地图</button>
    </div>

    <div class="section">
      <h3>2. 底图类型切换</h3>
      <div class="btn-group">
        <button onclick="switchMap('vec')">矢量</button>
        <button onclick="switchMap('img')">影像</button>
        <button onclick="switchMap('ter')">地形</button>
        <button onclick="switchMap('vec_cva')">矢量+注记</button>
        <button onclick="switchMap('img_cia')">影像+注记</button>
      </div>
    </div>

    <div class="section">
      <h3>3. 标记点 (Marker)</h3>
      <label>经度</label>
      <input type="number" id="markerLng" value="104.0665" step="0.0001" />
      <label>纬度</label>
      <input type="number" id="markerLat" value="30.657" step="0.0001" />
      <div class="btn-group">
        <button class="success" onclick="addMarker()">添加标记</button>
        <button class="danger" onclick="removeMarker()">移除标记</button>
      </div>
    </div>

    <div class="section">
      <h3>4. 视图控制</h3>
      <div class="btn-group">
        <button onclick="flyToBeijing()">flyTo 北京</button>
        <button onclick="flyToShanghai()">flyTo 上海</button>
        <button onclick="jumpToChengdu()">jumpTo 成都</button>
        <button onclick="setZoom5()">zoom=5</button>
        <button onclick="setZoom12()">zoom=12</button>
      </div>
    </div>

    <div class="section">
      <h3>5. 正向地理编码 (地址→坐标)</h3>
      <label>输入地址</label>
      <input type="text" id="geocodeAddr" value="成都市天府广场" />
      <button onclick="doGeocode()">查询坐标</button>
    </div>

    <div class="section">
      <h3>6. 反向地理编码 (坐标→地址)</h3>
      <label>经度</label>
      <input type="number" id="revLng" value="104.0665" step="0.0001" />
      <label>纬度</label>
      <input type="number" id="revLat" value="30.657" step="0.0001" />
      <button onclick="doReverseGeocode()">查询地址</button>
    </div>

    <div class="section">
      <h3>7. 地图搜索 (POI)</h3>
      <label>关键字</label>
      <input type="text" id="searchKeyword" value="酒店" />
      <label>返回数量</label>
      <input type="number" id="searchCount" value="10" min="1" max="50" />
      <button onclick="doSearch()">搜索</button>
    </div>

    <div class="section">
      <h3>8. 事件监听</h3>
      <div class="btn-group">
        <button class="success" onclick="enableClickEvent()">启用点击事件</button>
        <button class="warning" onclick="enableTouchEvent()">启用触摸事件</button>
      </div>
      <p style="font-size:12px;color:#888;margin-top:4px;">启用后点击地图会显示坐标信息</p>
    </div>

    <div class="section">
      <h3>9. 销毁地图</h3>
      <button class="danger" onclick="destroyMap()">销毁地图</button>
    </div>
  </div>

  <div class="map-wrapper">
    <div id="maplibre-map"></div>
    <div class="info-panel" id="infoPanel" style="display:none;">
      <pre id="infoContent"></pre>
    </div>
    <div class="coord-display" id="coordDisplay">移动鼠标查看坐标</div>
  </div>

  <script>
    let mapManager = null;
    let clickHandler = null;
    let touchHandler = null;

    function showInfo(data) {
      const panel = document.getElementById('infoPanel');
      const content = document.getElementById('infoContent');
      panel.style.display = 'block';
      content.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    function hideInfo() {
      document.getElementById('infoPanel').style.display = 'none';
    }

    function getApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) { alert('请先输入天地图 API Key'); return null; }
      return key;
    }

    function initMap() {
      const key = getApiKey();
      if (!key) return;
      if (mapManager) mapManager.destroy();

      mapManager = MaplibreTDT.createTianDiTuMap({
        container: 'maplibre-map',
        tiandituKey: key,
        serviceType: ['vec', 'cva'],
        center: [104.0665, 30.657],
        zoom: 9,
        minZoom: 3,
        maxZoom: 18,
      });

      mapManager.map.on('mousemove', (e) => {
        document.getElementById('coordDisplay').textContent =
          `经度: ${e.lngLat.lng.toFixed(6)}, 纬度: ${e.lngLat.lat.toFixed(6)}`;
      });
      showInfo('地图初始化成功！');
    }

    function switchMap(type) {
      if (!mapManager) { alert('请先初始化地图'); return; }
      const key = getApiKey();
      if (!key) return;

      let serviceType;
      switch (type) {
        case 'vec': serviceType = 'vec'; break;
        case 'img': serviceType = 'img'; break;
        case 'ter': serviceType = 'ter'; break;
        case 'vec_cva': serviceType = ['vec', 'cva']; break;
        case 'img_cia': serviceType = ['img', 'cia']; break;
        default: serviceType = 'vec';
      }

      mapManager.destroy();
      mapManager = MaplibreTDT.createTianDiTuMap({
        container: 'maplibre-map',
        tiandituKey: key,
        serviceType: serviceType,
        center: [104.0665, 30.657],
        zoom: 9,
      });

      mapManager.map.on('mousemove', (e) => {
        document.getElementById('coordDisplay').textContent =
          `经度: ${e.lngLat.lng.toFixed(6)}, 纬度: ${e.lngLat.lat.toFixed(6)}`;
      });
      showInfo(`已切换到: ${type}`);
    }

    function addMarker() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      const lng = parseFloat(document.getElementById('markerLng').value);
      const lat = parseFloat(document.getElementById('markerLat').value);
      if (isNaN(lng) || isNaN(lat)) { alert('坐标无效'); return; }
      mapManager.addMarker([lng, lat], { color: '#FF0000', draggable: true });
      showInfo(`标记已添加到 [${lng}, ${lat}]`);
    }

    function removeMarker() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      mapManager.removeMarker();
      showInfo('标记已移除');
    }

    function flyToBeijing() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      mapManager.flyTo({ center: [116.4074, 39.9042], zoom: 11, duration: 2000 });
      showInfo('flyTo 北京');
    }

    function flyToShanghai() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      mapManager.flyTo({ center: [121.4737, 31.2304], zoom: 11, duration: 2000 });
      showInfo('flyTo 上海');
    }

    function jumpToChengdu() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      mapManager.jumpTo({ center: [104.0665, 30.657], zoom: 10 });
      showInfo('jumpTo 成都');
    }

    function setZoom5() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      mapManager.setZoom(5);
      showInfo('zoom = 5');
    }

    function setZoom12() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      mapManager.setZoom(12);
      showInfo('zoom = 12');
    }

    async function doGeocode() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      const address = document.getElementById('geocodeAddr').value.trim();
      if (!address) { alert('地址不能为空'); return; }
      try {
        const result = await mapManager.getGeocode(address);
        showInfo(result);
      } catch (err) { showInfo('地理编码失败: ' + err.message); }
    }

    async function doReverseGeocode() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      const lng = document.getElementById('revLng').value;
      const lat = document.getElementById('revLat').value;
      try {
        const result = await mapManager.getReverseGeocode(lng, lat);
        showInfo(result);
      } catch (err) { showInfo('反向地理编码失败: ' + err.message); }
    }

    async function doSearch() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      const keyword = document.getElementById('searchKeyword').value.trim();
      const count = document.getElementById('searchCount').value;
      if (!keyword) { alert('关键字不能为空'); return; }
      try {
        const result = await mapManager.search({
          keyWord: keyword, start: '0', count: count, queryType: '1',
        });
        showInfo(result);
      } catch (err) { showInfo('搜索失败: ' + err.message); }
    }

    function enableClickEvent() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      if (clickHandler) mapManager.map.off('click', clickHandler);
      clickHandler = (e) => {
        showInfo(`点击事件触发\n经度: ${e.lngLat.lng.toFixed(6)}\n纬度: ${e.lngLat.lat.toFixed(6)}`);
      };
      mapManager.onClick(clickHandler);
      showInfo('点击事件已启用，请点击地图');
    }

    function enableTouchEvent() {
      if (!mapManager) { alert('请先初始化地图'); return; }
      if (touchHandler) mapManager.map.off('touchstart', touchHandler);
      touchHandler = (e) => {
        showInfo(`触摸事件触发\n经度: ${e.lngLat.lng.toFixed(6)}\n纬度: ${e.lngLat.lat.toFixed(6)}`);
      };
      mapManager.onTouch(touchHandler);
      showInfo('触摸事件已启用');
    }

    function destroyMap() {
      if (!mapManager) { alert('地图未初始化'); return; }
      mapManager.destroy();
      mapManager = null;
      clickHandler = null;
      touchHandler = null;
      hideInfo();
      showInfo('地图已销毁');
    }
  </script>
</body>

</html>
